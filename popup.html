<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectrum AI Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --color-primary: #0b57d0;
            --color-secondary: #09864d;
            --color-surface: #ffffff;
            --color-on-surface: #1f1f1f;
            --color-on-surface-variant: #5e5e5e;
            --color-outline: #e8eaed;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
        }

        body {
            font-family: var(--font-family);
            width: 350px;
            margin: 0;
            padding: 0;
            background: var(--color-surface);
            color: var(--color-on-surface);
        }

        .container {
            padding: var(--spacing-md);
        }

        .header {
            text-align: center;
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--color-outline);
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            margin: 4px 0 0 0;
            color: var(--color-on-surface-variant);
            font-size: 0.875rem;
        }

        .actions {
            display: grid;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
        }

        .btn {
            background: var(--color-primary);
            color: white;
            border: none;
            padding: 12px var(--spacing-md);
            border-radius: var(--radius-md);
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            transition: all 0.2s ease;
            font-size: 0.875rem;
        }

        .btn:hover {
            background: #0a4fc0;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-icon {
            font-size: 1.2rem;
            width: 20px;
            text-align: center;
        }

        .shortcuts {
            background: #f8f9fa;
            padding: var(--spacing-md);
            border-radius: var(--radius-lg);
            margin-top: var(--spacing-md);
        }

        .shortcuts h3 {
            margin: 0 0 var(--spacing-sm) 0;
            color: var(--color-primary);
            font-size: 0.875rem;
            font-weight: 600;
        }

        .shortcut-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-size: 0.8rem;
        }

        .keyboard-shortcut {
            background: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.75rem;
            border: 1px solid var(--color-outline);
        }

        .status {
            text-align: center;
            padding: var(--spacing-sm);
            border-radius: var(--radius-md);
            margin-top: var(--spacing-md);
            font-size: 0.8rem;
        }

        .status-ready {
            background: #e8f5e8;
            color: #1e8e3e;
            border: 1px solid #1e8e3e;
        }

        .status-not-ready {
            background: #ffebee;
            color: #d32f2f;
            border: 1px solid #d32f2f;
        }

        .footer {
            text-align: center;
            margin-top: var(--spacing-md);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--color-outline);
            font-size: 0.75rem;
            color: var(--color-on-surface-variant);
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Spectrum AI Pro</h1>
            <p>Professional AI Web Assistant</p>
        </div>

        <div class="actions">
            <button id="openSidePanel" class="btn">
                <span class="btn-icon">🚀</span>
                <span>Open Full Panel</span>
            </button>

            <button id="quickAudit" class="btn">
                <span class="btn-icon">🎯</span>
                <span>Quick Audit</span>
            </button>

            <button id="startDocFlow" class="btn">
                <span class="btn-icon">📝</span>
                <span>Start Doc Flow</span>
            </button>

            <button id="organizeTabs" class="btn">
                <span class="btn-icon">📁</span>
                <span>Organize Tabs</span>
            </button>
        </div>

        <div class="shortcuts">
            <h3>Keyboard Shortcuts</h3>
            <div class="shortcut-item">
                <span>Run Audit</span>
                <span class="keyboard-shortcut">⌘+⇧+A</span>
            </div>
            <div class="shortcut-item">
                <span>Start Doc Flow</span>
                <span class="keyboard-shortcut">⌘+⇧+S</span>
            </div>
            <div class="shortcut-item">
                <span>Organize Tabs</span>
                <span class="keyboard-shortcut">⌘+⇧+O</span>
            </div>
        </div>

        <div id="aiStatus" class="status status-not-ready">
            🔴 AI Model Not Available
        </div>

        <div class="footer">
            <p>Privacy-first • On-device processing • Professional grade</p>
        </div>
    </div>

    <script>
        // Check AI availability
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof self.LanguageModel !== 'undefined') {
                document.getElementById('aiStatus').className = 'status status-ready';
                document.getElementById('aiStatus').textContent = '🟢 AI Ready';
            }
        });

        // Button actions
        document.getElementById('openSidePanel').addEventListener('click', () => {
            chrome.sidePanel.open({ windowId: chrome.windows.WINDOW_ID_CURRENT });
        });

        document.getElementById('quickAudit').addEventListener('click', () => {
            chrome.sidePanel.open({ windowId: chrome.windows.WINDOW_ID_CURRENT });
            // Send message to run audit
            setTimeout(() => {
                chrome.runtime.sendMessage({ action: 'runQuickAudit' });
            }, 100);
        });

        document.getElementById('startDocFlow').addEventListener('click', () => {
            chrome.sidePanel.open({ windowId: chrome.windows.WINDOW_ID_CURRENT });
            setTimeout(() => {
                // trigger Doc Flow recording via service worker
                chrome.runtime.sendMessage({ action: 'startDocFlowRecording' });
            }, 100);
        });

        document.getElementById('organizeTabs').addEventListener('click', () => {
            chrome.sidePanel.open({ windowId: chrome.windows.WINDOW_ID_CURRENT });
            setTimeout(() => {
                chrome.runtime.sendMessage({ action: 'organizeTabs' });
            }, 100);
        });
    </script>
</body>
</html>
