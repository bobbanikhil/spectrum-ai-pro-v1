<!DOCTYPE html>
<html>
<head>
    <title>Spectrum AI Setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sidepanel.css">
    <style>
        body { padding: 2rem; background-color: #0d1117; }
        main { max-width: 700px; margin: auto; }
        .setup-step {
            background: var(--glass-background); border: 1px solid var(--glass-border);
            border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem;
        }
        .setup-step h3 { margin-top: 0; color: var(--color-accent); }
        .setup-step p { color: var(--color-text-faded); }
        .setup-step button { margin-top: 1rem; }
        .status { padding: 1.5rem; border-radius: 8px; margin-top: 1.5rem; border: 1px solid; }
        .status.success { background-color: rgba(39, 174, 96, 0.1); border-color: #27ae60; }
        .status.error { background-color: rgba(192, 57, 43, 0.1); border-color: #c0392b; }
        code { background-color: rgba(0,0,0,0.3); padding: 3px 6px; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>
    <div id="background-aurora"></div>
    <main>
        <header class="header"><h1>Welcome to Spectrum AI</h1></header>
        <p style="text-align: center; color: var(--color-text-faded); margin-bottom: 2rem;">Let's get your on-device AI ready. This is a one-time setup.</p>
        <div id="status-container">
            </div>
    </main>
    <script src="setup.js"></script>
</body>
</html>
